<div class="container">
  <h1>Angular Card Component</h1>
  <div class="row">
    @for (post of posts; track post.title) {
      <div class="col-md-3">
        <div class="card mb-4">
          <img class="card-img-top" [src]="post.imageUrl" [alt]="post.title">
          <div class="card-body">
            <h5 class="card-title">{{ post.title }}</h5>
          </div>
        </div>
      </div>
    }
  </div>
</div>
